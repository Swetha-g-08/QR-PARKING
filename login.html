<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | ParkEase</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="js/config.js" defer></script>
    <script src="js/supabase.js" defer></script>
    <script src="js/auth.js" defer></script>
</head>
<body style="display: flex; align-items: center; justify-content: center; min-height: 100vh;">
    <div class="auth-card">
        <div style="text-align: center; margin-bottom: 32px;">
            <div style="display: inline-flex; align-items: center; justify-content: center; width: 48px; height: 48px; background: rgba(185, 255, 241, 0.1); color: var(--accent-primary); border-radius: var(--radius-md); margin-bottom: 16px;">
                <i data-lucide="parking-circle" size="24"></i>
            </div>
            <h1 style="margin: 0; font-size: 24px;">Welcome Back</h1>
            <p class="muted" style="margin-top: 8px; font-size: 13px;">Sign in to manage your campus parking.</p>
        </div>
        
        <form id="login-form">
            <div class="form-group">
                <label for="email">Email Address</label>
                <div style="position: relative;">
                    <i data-lucide="mail" size="16" style="position: absolute; left: 12px; top: 14px; color: var(--text-muted);"></i>
                    <input type="email" id="email" required style="padding-left: 40px;" placeholder="alex@student.edu">
                </div>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <div style="position: relative;">
                    <i data-lucide="lock" size="16" style="position: absolute; left: 12px; top: 14px; color: var(--text-muted);"></i>
                    <input type="password" id="password" required style="padding-left: 40px;" placeholder="••••••••">
                </div>
            </div>
            
            <div id="login-error" class="error-msg text-center" style="margin-top: 16px;"></div>
            
            <button type="submit" class="btn" style="width: 100%; margin-top: 24px; padding: 12px;">
                Sign In <i data-lucide="arrow-right" size="16"></i>
            </button>
        </form>
        
        <div style="margin-top: 32px; text-align: center; font-size: 13px; color: var(--text-secondary);">
            Don't have an account? <a href="register.html" style="font-weight: 500;">Create an account</a>
        </div>
    </div>
    <script>
        lucide.createIcons();
    </script>
</body>
</html>
