<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | CampusPark</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="js/config.js" defer></script>
    <script src="js/supabase.js" defer></script>
    <script src="js/auth.js" defer></script>
</head>
<body style="display: flex; align-items: center; justify-content: center; min-height: 100vh;">
    <div class="auth-card">
        <div style="text-align: center; margin-bottom: 32px;">
            <div style="display: inline-flex; align-items: center; justify-content: center; width: 48px; height: 48px; background: rgba(185, 255, 241, 0.1); color: var(--accent-primary); border-radius: var(--radius-md); margin-bottom: 16px;">
                <i data-lucide="parking-circle" size="24"></i>
            </div>
            <h1 style="margin: 0; font-size: 24px;">Welcome Back</h1>
            <p class="muted" style="margin-top: 8px; font-size: 13px;">Enter your phone number to continue.</p>
        </div>
        
        <!-- STEP 1: Phone Number -->
        <div id="login-step-phone">
            <form id="login-phone-form">
                <div class="form-group">
                    <label for="phone">Phone Number</label>
                    <div style="position: relative;">
                        <i data-lucide="phone" size="16" style="position: absolute; left: 12px; top: 14px; color: var(--text-muted);"></i>
                        <input type="tel" id="phone" required style="padding-left: 40px;" placeholder="+91 9876543210" pattern="^\+?[0-9\s-]{10,15}$">
                    </div>
                    <p class="muted" style="font-size: 11px; margin-top: 4px;">Use E.164 format with country code (e.g. +91)</p>
                </div>
                
                <div id="login-error" class="error-msg text-center" style="margin-top: 16px;"></div>
                
                <button type="submit" class="btn" style="width: 100%; margin-top: 24px; padding: 12px;">
                    SEND OTP <i data-lucide="arrow-right" size="16"></i>
                </button>
            </form>
            
            <div style="margin-top: 32px; text-align: center; font-size: 13px; color: var(--text-secondary);">
                Don't have an account? <a href="register.html" style="font-weight: 500;">Create Account</a>
            </div>
        </div>

        <!-- STEP 2: OTP Verification -->
        <div id="login-step-otp" style="display: none;">
            <div style="text-align: center; margin-bottom: 24px;">
                <h2 style="font-size: 18px; font-weight: 600; margin-bottom: 8px;">Verify your phone</h2>
                <p class="muted" style="font-size: 13px;">We sent a verification code to:<br><strong id="display-phone" style="color: var(--text-primary);"></strong></p>
            </div>

            <form id="login-otp-form">
                <div class="otp-container">
                    <input type="text" class="otp-input" maxlength="1" pattern="[0-9]" inputmode="numeric" required>
                    <input type="text" class="otp-input" maxlength="1" pattern="[0-9]" inputmode="numeric" required>
                    <input type="text" class="otp-input" maxlength="1" pattern="[0-9]" inputmode="numeric" required>
                    <input type="text" class="otp-input" maxlength="1" pattern="[0-9]" inputmode="numeric" required>
                    <input type="text" class="otp-input" maxlength="1" pattern="[0-9]" inputmode="numeric" required>
                    <input type="text" class="otp-input" maxlength="1" pattern="[0-9]" inputmode="numeric" required>
                </div>

                <div id="otp-error" class="error-msg text-center"></div>

                <button type="submit" class="btn" style="width: 100%; margin-top: 24px; padding: 12px;">
                    VERIFY & CONTINUE
                </button>
            </form>

            <div class="otp-resend-container">
                <span id="resend-text">Didn't receive the code?</span>
                <button type="button" id="resend-btn" class="otp-resend-btn">Resend OTP</button>
            </div>

            <div style="text-align: center; margin-top: 16px;">
                <button type="button" onclick="changePhoneNumber('login')" style="background: none; border: none; color: var(--text-muted); font-size: 12px; cursor: pointer;">
                    CHANGE PHONE NUMBER
                </button>
            </div>
        </div>

    </div>
    <script>
        lucide.createIcons();
    </script>
</body>
</html>
