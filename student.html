<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Student Dashboard</title><link rel="stylesheet" href="css/style.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script><script defer src="js/config.js"></script><script defer src="js/supabase.js"></script><script defer src="js/auth.js"></script><script defer src="js/student.js"></script></head><body><nav><a href="student.html">College Parking</a><span>Dashboard</span><button class="nav-btn" onclick="logoutUser()">Logout</button></nav><main class="container"><section class="card"><h1 id="welcomeMessage">Welcome</h1><div id="vehicleDetails"></div></section><section class="card hidden" id="currentSessionSection" style="text-align:center;"><h2 style="text-transform:uppercase; font-size:1.1rem; color:var(--muted); letter-spacing:1px; margin-bottom:20px;">YOUR DIGITAL PARKING PASS</h2><div id="qrCode" style="margin: 0 auto;"></div><div id="sessionDetails" style="text-align:left; margin-top:20px;"></div><button id="downloadQrBtn" class="btn hidden" style="margin-top:20px;" onclick="downloadQR()">Download QR</button></section><section class="card hidden" id="bookSlotSection"><h2>Available Parking</h2><p>Select a slot matching your vehicle.</p><div id="slotsContainer" class="slots"></div><p id="booking-error" class="error-msg"></p><button id="bookBtn" class="btn hidden" onclick="createParkingSession()">Confirm Parking</button></section><section class="card"><h2>Parking History</h2><div id="historyContainer"></div></section></main></body></html>
