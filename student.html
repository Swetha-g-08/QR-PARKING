<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Student Dashboard</title><link rel="stylesheet" href="css/style.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script><script defer src="js/config.js"></script><script defer src="js/supabase.js"></script><script defer src="js/auth.js"></script><script defer src="js/student.js"></script></head><body><nav><a href="student.html">College Parking</a><span>Dashboard</span><button class="nav-btn" onclick="logoutUser()">Logout</button></nav><main class="container"><section class="card" style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:20px;"><div><h1 id="welcomeMessage">Welcome</h1><div id="vehicleDetails"></div></div><div style="text-align:center;"><div id="vehicleQrCode"></div><small class="muted">Vehicle QR</small></div></section><section class="card hidden" id="currentSessionSection"><h2>Parking Session Created</h2><div id="sessionDetails"></div><div id="qrCode"></div><button id="downloadQrBtn" class="btn hidden" onclick="downloadQR()">Download QR</button></section><section class="card hidden" id="bookSlotSection"><h2>Available Parking</h2><p>Select a slot matching your vehicle.</p><div id="slotsContainer" class="slots"></div><p id="booking-error" class="error-msg"></p><button id="bookBtn" class="btn hidden" onclick="createParkingSession()">Confirm Parking</button></section><section class="card"><h2>Parking History</h2><div id="historyContainer"></div></section></main></body></html>
