<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Dashboard</title><link rel="stylesheet" href="css/style.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script defer src="js/config.js"></script><script defer src="js/supabase.js"></script><script defer src="js/auth.js"></script><script defer src="js/admin.js"></script></head><body><nav><a href="admin.html">College Parking</a><span>Admin Dashboard</span><button class="nav-btn" onclick="logoutUser()">Logout</button></nav><main class="container"><section class="stats"><div class="card"><small>Total Slots</small><strong id="statTotal">0</strong></div><div class="card"><small>Available Slots</small><strong id="statAvailable">0</strong></div><div class="card"><small>Occupied Slots</small><strong id="statOccupied">0</strong></div><div class="card"><small>Active Sessions</small><strong id="statActiveSessions">0</strong></div></section><section class="card"><h2>Parking Slot Management</h2><div class="inline-form"><input id="newSlotNumber" placeholder="Slot number e.g. B11"><select id="newSlotType"><option value="bike">Bike</option><option value="car">Car</option></select><button class="btn" onclick="addSlot()">Add Slot</button></div><p id="admin-message" class="error-msg"></p><div id="adminSlotsContainer" class="slots"></div></section><section class="card"><h2>Students</h2><div id="studentsTable"></div></section><section class="card"><h2>Active Parking Sessions</h2><div id="activeTable"></div></section><section class="card"><h2>Parking History</h2><div id="historyTable"></div></section></main></body></html>
