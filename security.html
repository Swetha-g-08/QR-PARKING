<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Security Dashboard | ParkEase</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script defer src="js/config.js"></script>
    <script defer src="js/supabase.js"></script>
    <script defer src="js/auth.js"></script>
    <script defer src="js/security.js"></script>
</head>
<body>
    <div class="dashboard-wrapper">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-logo">
                <i data-lucide="shield-check"></i>
            </div>
            <nav class="sidebar-nav">
                <a href="#scanner" class="nav-item active" data-tooltip="QR Scanner">
                    <i data-lucide="scan-line"></i>
                </a>
            </nav>
            <div class="sidebar-bottom">
                <button class="nav-item" onclick="logoutUser()" data-tooltip="Logout">
                    <i data-lucide="log-out"></i>
                </button>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <!-- Header -->
            <header class="top-header">
                <div class="header-left">
                    <div class="page-title">Security Control</div>
                    <div class="page-subtitle">Verify vehicle parking access.</div>
                </div>
                <div class="header-right">
                    <div class="user-profile">
                        <div class="avatar"><i data-lucide="shield" size="16"></i></div>
                        <span class="user-name">Security Warden</span>
                    </div>
                </div>
            </header>

            <!-- Dashboard Content -->
            <div class="dashboard-container" style="max-width: 800px;">
                
                <div class="dashboard-grid" style="grid-template-columns: 1fr;">
                    
                    <!-- Scanner Section -->
                    <section class="card" style="text-align: center;">
                        <h2 style="font-size: 20px;">QR Scanner</h2>
                        <p class="muted" style="margin-bottom: 24px;">Scan a vehicle QR code to verify parking access.</p>
                        
                        <div style="background: rgba(255,255,255,0.02); padding: 16px; border-radius: var(--radius-lg); border: 1px solid var(--border); margin-bottom: 24px;">
                            <div id="reader" style="display: none;"></div>
                            
                            <div id="cameraControls" style="display: flex; gap: 12px; justify-content: center; margin-top: 16px;">
                                <button id="startCamBtn" class="btn" onclick="startCamera()"><i data-lucide="camera" size="16"></i> Start Camera</button>
                                <button id="stopCamBtn" class="btn btn-danger hidden" onclick="stopCamera()"><i data-lucide="camera-off" size="16"></i> Stop Camera</button>
                            </div>
                        </div>
                        
                        <div style="display: flex; align-items: center; justify-content: center; margin: 24px 0;">
                            <div style="height: 1px; background: var(--border); flex: 1;"></div>
                            <span class="muted" style="padding: 0 16px; font-size: 12px; font-weight: 500; text-transform: uppercase;">OR</span>
                            <div style="height: 1px; background: var(--border); flex: 1;"></div>
                        </div>
                        
                        <div style="max-width: 400px; margin: 0 auto; text-align: left;">
                            <label for="manualToken">Enter QR Token Manually</label>
                            <form class="inline-form" onsubmit="verifyManualToken(event)">
                                <input type="text" id="manualToken" placeholder="e.g. PARK-7A82F91C-X52K" style="flex: 1;" required>
                                <button type="submit" id="verifyBtn" class="btn">Verify</button>
                            </form>
                        </div>
                    </section>

                    <!-- Session Verification Result -->
                    <section id="sessionInfo" class="card hidden">
                        <div style="display: flex; align-items: center; gap: 12px; margin-bottom: 24px; color: var(--accent-primary);">
                            <i data-lucide="check-circle-2" size="24"></i>
                            <h2 style="margin: 0; color: inherit; font-size: 20px;">Vehicle Verified</h2>
                        </div>
                        
                        <div id="sessionDetails" style="background: var(--card-secondary); border-radius: var(--radius-md); padding: 20px; margin-bottom: 24px;"></div>
                        
                        <div id="actionButtons" style="display: flex; gap: 16px; justify-content: flex-end;"></div>
                    </section>

                </div>
            </div>
        </main>
    </div>
    
    <script>
        lucide.createIcons();
    </script>
</body>
</html>
