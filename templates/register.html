{% extends "base.html" %}

{% block title %}Register Your Vehicle - CampusPark{% endblock %}

{% block content %}
<style>
.selection-card.active {
    border-color: #171717 !important;
    border-width: 2px !important;
    background-color: #ffffff !important;
    box-shadow: 0px 4px 20px rgba(0,0,0,0.04);
}
</style>

<div class="flex-grow flex items-center justify-center py-xl px-gutter max-w-2xl mx-auto">
<div class="w-full">
<!-- Header Text -->
<div class="mb-lg">
<h1 class="font-headline-lg text-headline-lg text-primary mb-xs">Register your vehicle</h1>
<p class="font-body-md text-body-md text-secondary">It only takes a minute. We'll create a personal parking QR for you.</p>
</div>

<!-- Registration Form -->
<form class="space-y-lg" action="{{ url_for('register') }}" method="POST">
<input type="hidden" name="vehicle_type" id="vehicle_type" value="Car">

<!-- Vehicle Type Selection -->
<div class="space-y-base">
<label class="font-label-sm text-label-sm text-secondary uppercase tracking-wider block">Vehicle Type</label>
<div class="grid grid-cols-2 gap-md">
<button class="selection-card active flex flex-col items-center justify-center p-xl rounded-xl border border-outline-variant bg-surface transition-all duration-200 group" id="type-car" onclick="selectVehicleType('Car')" type="button">
<span class="material-symbols-outlined text-[48px] mb-sm group-hover:scale-110 transition-transform">directions_car</span>
<span class="font-label-md text-label-md">Car</span>
</button>
<button class="selection-card flex flex-col items-center justify-center p-xl rounded-xl border border-outline-variant bg-surface transition-all duration-200 group" id="type-bike" onclick="selectVehicleType('Bike')" type="button">
<span class="material-symbols-outlined text-[48px] mb-sm group-hover:scale-110 transition-transform">pedal_bike</span>
<span class="font-label-md text-label-md">Bike</span>
</button>
</div>
</div>

<!-- Input Fields Grid -->
<div class="grid grid-cols-1 md:grid-cols-2 gap-x-lg gap-y-md">
<div class="space-y-xs">
<label class="font-label-sm text-label-sm text-secondary uppercase tracking-wider block" for="name">Your name</label>
<input class="w-full bg-transparent border border-outline-variant rounded-lg px-md py-sm font-body-md text-body-md transition-colors" id="name" name="name" placeholder="John Doe" required type="text"/>
</div>
<div class="space-y-xs">
<label class="font-label-sm text-label-sm text-secondary uppercase tracking-wider block" for="college_id">College ID</label>
<input class="w-full bg-transparent border border-outline-variant rounded-lg px-md py-sm font-body-md text-body-md transition-colors" id="college_id" name="college_id" placeholder="C-29384" required type="text"/>
</div>
<div class="space-y-xs">
<label class="font-label-sm text-label-sm text-secondary uppercase tracking-wider block" for="email">Email</label>
<input class="w-full bg-transparent border border-outline-variant rounded-lg px-md py-sm font-body-md text-body-md transition-colors" id="email" name="email" placeholder="j.doe@university.edu" required type="email"/>
</div>
<div class="space-y-xs">
<label class="font-label-sm text-label-sm text-secondary uppercase tracking-wider block" for="vehicle_number">Vehicle number</label>
<input class="w-full bg-transparent border border-outline-variant rounded-lg px-md py-sm font-body-md text-body-md transition-colors uppercase font-bold" id="vehicle_number" name="vehicle_number" placeholder="ABC-1234" required type="text"/>
</div>
</div>

<!-- Action Area -->
<div class="pt-md">
<button class="w-full bg-primary text-on-primary py-md px-xl rounded-xl font-headline-md text-headline-md hover:opacity-90 active:scale-[0.98] transition-all flex items-center justify-center gap-sm" type="submit">
<span>Create my parking QR</span>
<span class="material-symbols-outlined">arrow_forward</span>
</button>
<p class="text-center mt-md text-label-sm text-secondary">
By registering, you agree to our Campus Parking Terms &amp; Privacy Policy.
</p>
</div>
</form>
</div>
</div>

<script>
function selectVehicleType(type) {
    document.getElementById('vehicle_type').value = type;
    const carBtn = document.getElementById('type-car');
    const bikeBtn = document.getElementById('type-bike');
    if (type === 'Car') {
        carBtn.classList.add('active');
        bikeBtn.classList.remove('active');
    } else {
        bikeBtn.classList.add('active');
        carBtn.classList.remove('active');
    }
}
</script>
{% endblock %}
