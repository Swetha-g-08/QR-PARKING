{% extends "base.html" %}

{% block title %}CampusPark | Register Vehicle{% endblock %}

{% block content %}
<div class="page-head">
  <h2>🚗 Vehicle Registration</h2>
  <p>Register your vehicle to receive a unique parking QR code.</p>
</div>

<div class="card form-card">
  <form method="POST" action="{{ url_for('register') }}" autocomplete="off">
    <div class="form-group">
      <label for="name">Student / Staff Name</label>
      <input type="text" id="name" name="name" placeholder="e.g. AJ" required>
    </div>

    <div class="form-group">
      <label for="college_id">College ID</label>
      <input type="text" id="college_id" name="college_id" placeholder="e.g. 23CSE001" required>
    </div>

    <div class="form-group">
      <label for="email">Email</label>
      <input type="email" id="email" name="email" placeholder="e.g. aj@college.edu" required>
    </div>

    <div class="form-group">
      <label for="vehicle_number">Vehicle Number</label>
      <input type="text" id="vehicle_number" name="vehicle_number" placeholder="e.g. TN38AB1234"
             required maxlength="15"
             oninput="this.value = this.value.toUpperCase()">
      <small class="hint">Auto-converted to uppercase. Must be unique.</small>
    </div>

    <div class="form-group">
      <label for="vehicle_type">Vehicle Type</label>
      <select id="vehicle_type" name="vehicle_type" required>
        <option value="" disabled selected>Select type</option>
        <option value="Bike">🏍️ Bike</option>
        <option value="Car">🚗 Car</option>
      </select>
    </div>

    <button type="submit" class="btn btn-primary btn-block btn-lg">Register &amp; Generate QR</button>
  </form>
</div>
{% endblock %}
