{% extends "base.html" %}

{% block title %}Admin Login - CampusPark{% endblock %}

{% block content %}
<div class="max-w-md mx-auto py-12">
  <div class="bg-white border border-outline-variant rounded-2xl p-8 shadow-sm space-y-6">
    <div class="text-center">
      <div class="w-12 h-12 rounded-2xl bg-primary text-on-primary flex items-center justify-center mx-auto text-2xl font-bold mb-3">
        <span class="emoji">🅿️</span>
      </div>
      <h2 class="text-2xl font-black text-primary">Admin Console Login</h2>
      <p class="text-xs font-semibold text-secondary mt-1">Sign in to manage parking slots & verify entry/exit.</p>
    </div>

    <form action="{{ url_for('login') }}" method="POST" class="space-y-4">
      <div class="space-y-1">
        <label class="text-xs font-bold text-secondary uppercase tracking-wider block" for="username">Username</label>
        <input type="text" id="username" name="username" required placeholder="admin"
               class="w-full bg-surface border border-outline-variant rounded-xl px-4 py-3 text-sm font-bold focus:border-primary focus:ring-0 outline-none">
      </div>

      <div class="space-y-1">
        <label class="text-xs font-bold text-secondary uppercase tracking-wider block" for="password">Password</label>
        <input type="password" id="password" name="password" required placeholder="••••••••"
               class="w-full bg-surface border border-outline-variant rounded-xl px-4 py-3 text-sm font-bold focus:border-primary focus:ring-0 outline-none">
      </div>

      <button type="submit" class="w-full bg-primary text-on-primary py-3.5 px-4 rounded-xl font-bold text-sm hover:opacity-90 transition-opacity shadow-sm mt-2">
        Log In to Console
      </button>
    </form>

    <div class="p-3 bg-surface-container rounded-xl text-center text-xs font-medium text-secondary">
      Default Credentials: <strong class="text-primary font-bold">admin / admin123</strong>
    </div>
  </div>
</div>
{% endblock %}
