{% extends "base.html" %}

{% block title %}CampusPark | Admin Login{% endblock %}

{% block content %}
<div class="page-head">
  <h2>🔐 Security / Admin Login</h2>
  <p>Login to access the scanner, dashboard and parking controls.</p>
</div>

<div class="card form-card form-card-narrow">
  <form method="POST" action="{{ url_for('login', next=request.args.get('next')) }}" autocomplete="off">
    <div class="form-group">
      <label for="username">Username</label>
      <input type="text" id="username" name="username" placeholder="admin" required>
    </div>
    <div class="form-group">
      <label for="password">Password</label>
      <input type="password" id="password" name="password" placeholder="••••••••" required>
    </div>
    <button type="submit" class="btn btn-primary btn-block btn-lg">Login</button>
  </form>
  <p class="login-hint">Default credentials for the demo: <code>admin / admin123</code></p>
</div>
{% endblock %}
