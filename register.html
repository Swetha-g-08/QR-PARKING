<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | CampusPark</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="js/config.js" defer></script>
    <script src="js/supabase.js" defer></script>
    <script src="js/auth.js" defer></script>
</head>
<body style="display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 40px 20px;">
    <div class="auth-card" style="max-width: 500px;">
        <div style="text-align: center; margin-bottom: 32px;">
            <div style="display: inline-flex; align-items: center; justify-content: center; width: 48px; height: 48px; background: rgba(185, 255, 241, 0.1); color: var(--accent-primary); border-radius: var(--radius-md); margin-bottom: 16px;">
                <i data-lucide="user-plus" size="24"></i>
            </div>
            <h1 style="margin: 0; font-size: 24px;">Create your CampusPark account</h1>
            <p class="muted" style="margin-top: 8px; font-size: 13px;">Start using smart campus parking.</p>
        </div>
        
        <form id="register-form">
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px;">
                <div class="form-group" style="grid-column: 1 / -1;">
                    <label for="name">Full Name</label>
                    <div style="position: relative;">
                        <i data-lucide="user" size="16" style="position: absolute; left: 12px; top: 14px; color: var(--text-muted);"></i>
                        <input type="text" id="name" required style="padding-left: 40px;" placeholder="Alex Kumar">
                    </div>
                </div>
                
                <div class="form-group" style="grid-column: 1 / -1;">
                    <label for="student_id">Student ID</label>
                    <div style="position: relative;">
                        <i data-lucide="hash" size="16" style="position: absolute; left: 12px; top: 14px; color: var(--text-muted);"></i>
                        <input type="text" id="student_id" required style="padding-left: 40px;" placeholder="23CS001">
                    </div>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <div style="position: relative;">
                        <i data-lucide="lock" size="16" style="position: absolute; left: 12px; top: 14px; color: var(--text-muted);"></i>
                        <input type="password" id="password" required style="padding-left: 40px;" placeholder="********">
                    </div>
                </div>

                <div class="form-group">
                    <label for="confirm_password">Confirm Password</label>
                    <div style="position: relative;">
                        <i data-lucide="lock" size="16" style="position: absolute; left: 12px; top: 14px; color: var(--text-muted);"></i>
                        <input type="password" id="confirm_password" required style="padding-left: 40px;" placeholder="********">
                    </div>
                </div>
                
                <div class="form-group">
                    <label for="vehicle_type">Vehicle Type</label>
                    <div style="position: relative;">
                        <i data-lucide="car" size="16" style="position: absolute; left: 12px; top: 14px; color: var(--text-muted);"></i>
                        <select id="vehicle_type" required style="padding-left: 40px; appearance: none;">
                            <option value="bike">Bike</option>
                            <option value="car">Car</option>
                        </select>
                        <i data-lucide="chevron-down" size="16" style="position: absolute; right: 12px; top: 14px; color: var(--text-muted); pointer-events: none;"></i>
                    </div>
                </div>

                <div class="form-group">
                    <label for="vehicle_number">Vehicle Number</label>
                    <div style="position: relative;">
                        <i data-lucide="hash" size="16" style="position: absolute; left: 12px; top: 14px; color: var(--text-muted);"></i>
                        <input type="text" id="vehicle_number" required style="padding-left: 40px;" placeholder="TN 01 AB 1234">
                    </div>
                </div>
            </div>
            
            <div id="register-error" class="error-msg text-center" style="margin-top: 16px;"></div>
            
            <button type="submit" class="btn" style="width: 100%; margin-top: 24px; padding: 12px;">
                CREATE ACCOUNT <i data-lucide="arrow-right" size="16"></i>
            </button>
        </form>
        
        <div style="margin-top: 32px; text-align: center; font-size: 13px; color: var(--text-secondary);">
            Already have an account? <a href="login.html" style="font-weight: 500;">Sign in</a>
        </div>

    </div>
    <script>
        lucide.createIcons();
    </script>
</body>
</html>
