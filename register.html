<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>College Parking - Register</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/config.js" defer></script>
    <script src="js/supabase.js" defer></script>
    <script src="js/auth.js" defer></script>
</head>
<body>
    <div class="container mt-2">
        <div class="card" style="max-width: 500px; margin: 0 auto;">
            <h1 class="text-center">Student Registration</h1>
            <form id="register-form">
                <div class="form-group">
                    <label for="name">Full Name</label>
                    <input type="text" id="name" required>
                </div>
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" required>
                </div>
                <div class="form-group">
                    <label for="password">Password (min 6 chars)</label>
                    <input type="password" id="password" required minlength="6">
                </div>
                <div class="form-group">
                    <label for="phone">Phone Number</label>
                    <input type="text" id="phone" required>
                </div>
                <div class="form-group">
                    <label for="vehicle_number">Vehicle Number (e.g. TN XX XX XXXX)</label>
                    <input type="text" id="vehicle_number" required>
                </div>
                <div class="form-group">
                    <label for="vehicle_type">Vehicle Type</label>
                    <select id="vehicle_type" required>
                        <option value="bike">Bike</option>
                        <option value="car">Car</option>
                    </select>
                </div>
                <div id="register-error" class="error-msg"></div>
                <button type="submit" class="btn mt-1">Register</button>
            </form>
            <p class="text-center mt-1">
                Already have an account? <a href="login.html">Login</a>
            </p>
        </div>
    </div>
</body>
</html>
